[target_information]
repo_path = "external_repos/EventFlow"
branch_name = "develop-v1"
commit_list = ["6bc5eb39eb34792ccbd6b5dbb0d98c2354c950f5"]
ignore_files = ["README.md", "CHANGELOG.md", "CONTRIBUTING.md", "RELEASE_NOTES.md"]
# Opcional: Nome do repositório no formato "owner/repo" para buscar issues
# github_repo_name = "owner/repo"
[agents]

[[agents.output]]
result_path = "output/"
log_path = "logs/"
result_file_name = "r_event1.md"

[[agents.orchestration]]
step = 1
model_name = "gemini-2.5-flash-lite"
temperature = 0.2
template_path = "prompt/"
prompt_file = "changelog.jinja"
prompt_variables = { name = "GitHub Docs", repo = "external_repos/EventFlow" }
