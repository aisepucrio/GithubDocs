[project]
name = "GithubDocs"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydriller",
    "google-generativeai",
    "ruff>=0.1.0",
    "openai",
    "python-dotenv",
    "tiktoken==0.12.0",
    "sqlalchemy==2.0.43",
    "gitpython==3.1.45",
    "nltk",
    "jinja2",
    "tomli", #This lib have compatibility with python 3.10 but not with 3.11 TODO: decicde the python version
    "pydantic>=2.12.0",
    "ollama",
    "dotenv>=0.9.9",
    "identify[license]",
    "langchain-core>=1.2.7",
    "langchain-google-genai>=4.2.0",
    "langchain",
    "pygithub>=2.1.0",
    "gspread>=6.2.1",
    "google-auth>=2.48.0",
    "langchain-ollama>=1.0.1",
    "langchain-community>=0.4.1",
    "langfuse>=4.0.0",
    "langchain-text-splitters>=1.1.0",
]

[project.optional-dependencies]
benchmark = [
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
]

[tool.ruff]
# Enable pycodestyle (`E`), Pyflakes (`F`), isort (`I`), naming (`N`), warning (`W`), pep8-naming (`N`), and Ruff-specific rules (`RUF`)
select = ["E", "F", "I", "N", "W", "B", "RUF"]
ignore = []

# Exclude directories and files
exclude = [
    ".git",
    "__pycache__",
    "*.pyc",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py files
