[project]
name = "GithubDocs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-generativeai",
    "ruff>=0.1.0",
    "openai",
    "google-genai==1.31.0",
    "python-dotenv",
    "tiktoken==0.11.0",
    "sqlalchemy==2.0.43",
    "gitpython==3.1.45",
    "nltk",
    "Jinja2",
    "pydriller"
]

[tool.ruff]
# Enable pycodestyle (`E`), Pyflakes (`F`), isort (`I`), naming (`N`), warning (`W`), pep8-naming (`N`), and Ruff-specific rules (`RUF`)
select = ["E", "F", "I", "N", "W", "B", "RUF"]
ignore = []

# Exclude directories and files
exclude = [
    ".git",
    "__pycache__",
    "*.pyc",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Ignore unused imports in __init__.py files
